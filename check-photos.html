<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photo link checker</title>
<style>body{font:16px/1.5 system-ui,sans-serif;max-width:900px;margin:24px auto;padding:0 16px}.r{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid #ddd}.r img{width:120px;height:60px;object-fit:cover;background:#eee}.ok{color:#1b7a3d;font-weight:700}.bad{color:#b3262e;font-weight:700}small{color:#666;word-break:break-all}</style></head><body>
<h1>Photo link checker</h1><p>Open this page with an internet connection. Each row loads the real photo and shows whether it worked.</p><div id="out"></div>
<script>
var L=[[1, "Everest Base Camp Trek", "https://commons.wikimedia.org/wiki/Special:FilePath/Mt.Everest.jpg?width=1280"], [2, "Annapurna Homestay Trek", "https://commons.wikimedia.org/wiki/Special:FilePath/Ghandruk_architecture.jpg?width=1280"], [3, "Langtang Valley Trek", "https://commons.wikimedia.org/wiki/Special:FilePath/Around_Kyanjin_Valley,_Langtang_National_Park,_Rasuwa,_Nepal_17.jpg?width=1280"], [4, "Manaslu Circuit", "https://commons.wikimedia.org/wiki/Special:FilePath/Sunrise,_Manaslu.jpg?width=1280"], [5, "Upper Mustang Journey", "https://commons.wikimedia.org/wiki/Special:FilePath/The_kingdom_of_Lo,_Lomangthang,_Upper_Mustang_(Pano).jpg?width=1920"], [8, "Pokhara Lakes & Farms", "https://commons.wikimedia.org/wiki/Special:FilePath/Phewa_lake,_Pokhara.jpg?width=1280"], [9, "Chitwan Community Safari", "https://commons.wikimedia.org/wiki/Special:FilePath/Greater_one-horned_rhinoceros_at_Chitwan.jpg?width=1280"], [11, "Lumbini Cycle & Culture", "https://commons.wikimedia.org/wiki/Special:FilePath/Maya_Devi_Temple_-_Lumbini.jpg?width=1280"], [12, "Kathmandu Valley Heritage", "https://commons.wikimedia.org/wiki/Special:FilePath/Patan_Durbar_Square_IMG_1741_32.jpg?width=1280"]];
var out=document.getElementById("out");
L.forEach(function(r){var d=document.createElement("div");d.className="r";d.innerHTML='<img alt=""><div><b>'+r[1]+'</b> <span>checking...</span><br><small>'+r[2]+'</small></div>';out.appendChild(d);
 var im=d.querySelector("img"),s=d.querySelector("span");
 im.onload=function(){s.className="ok";s.textContent="OK "+im.naturalWidth+" x "+im.naturalHeight+" px"};
 im.onerror=function(){s.className="bad";s.textContent="FAILED to load"};im.src=r[2]});
</script></body></html>
